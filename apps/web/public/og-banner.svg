<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Interactive Tasks — AI-powered interactive learning">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Onest:wght@300;400;700&display=swap');
    ]]></style>

    <radialGradient id="bg-grad" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>

    <pattern id="dot-grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="white" opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>

  <!-- Icon: 160×160, centered at x=600, top at y=152 -->
  <!-- Scale: 160/440 = 0.36364 -->
  <g transform="translate(520, 152) scale(0.36364)">
    <rect width="440" height="440" rx="88" fill="#1a1a2e"/>
    <g transform="translate(220, 220)">
      <polygon points="0,-148 148,0 0,148 -148,0"
               fill="none" stroke="#e0573a" stroke-width="13" stroke-linejoin="round"/>
      <polygon points="0,-94 94,0 0,94 -94,0" fill="#e0573a"/>
      <polygon points="0,-49 49,0 0,49 -49,0" fill="#ffffff" opacity="0.93"/>
      <circle cx="0" cy="0" r="20" fill="#e0573a"/>
      <line x1="67" y1="-67" x2="108" y2="-108"
            stroke="#e0573a" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
      <line x1="47" y1="-77" x2="76" y2="-121"
            stroke="#e0573a" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
      <line x1="67" y1="67" x2="108" y2="108"
            stroke="#e0573a" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
      <line x1="47" y1="77" x2="76" y2="121"
            stroke="#e0573a" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="600" y="372" text-anchor="middle"
        font-family="Onest, system-ui, sans-serif"
        font-size="60" fill="white">
    <tspan font-weight="400">Interactive </tspan><tspan font-weight="700">Tasks</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="414" text-anchor="middle"
        font-family="Onest, system-ui, sans-serif"
        font-size="22" font-weight="300" fill="white" opacity="0.48">
    AI-powered interactive learning
  </text>

  <!-- Ghost diamonds — decorative echoes in corners -->
  <!-- Top-right -->
  <g transform="translate(1088, 80)" opacity="0.12">
    <polygon points="0,-38 38,0 0,38 -38,0"
             fill="none" stroke="#e0573a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,-22 22,0 0,22 -22,0" fill="#e0573a"/>
    <polygon points="0,-11 11,0 0,11 -11,0" fill="#1a1a2e"/>
  </g>
  <!-- Bottom-left -->
  <g transform="translate(112, 548)" opacity="0.09">
    <polygon points="0,-28 28,0 0,28 -28,0"
             fill="none" stroke="#e0573a" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#e0573a"/>
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#1a1a2e"/>
  </g>
  <!-- Bottom-right (smallest) -->
  <g transform="translate(1060, 510)" opacity="0.07">
    <polygon points="0,-20 20,0 0,20 -20,0"
             fill="none" stroke="#e0573a" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="0,-11 11,0 0,11 -11,0" fill="#e0573a"/>
  </g>
</svg>
